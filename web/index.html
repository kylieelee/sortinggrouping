<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sorting &amp; Grouping Web — Alertive</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#14304c; --navy-50:#0c2237; --teal-90:#add5dd; --coral:#ef7d6b; --off-white:#f5f7f6; --grey-100:#dde2e7;
    --text:#212529; --text-2:#5c5d5f; --text-3:#5f6367; --group-text:#3d4a57; --border:#ced4da; --line:#f2f1f6; --radio-border:#dee2e6;
    --urgent:#ff3b30; --medium:#fd7e14; --low:#34c759; --progress:#fd7e14; --done:#198754; --flag:#ef6c00; --quick-off:#adb5bd;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#fff; font-family:'Open Sans', system-ui, sans-serif; color:var(--text); font-size:14px; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  img, svg { display:block; flex-shrink:0; }

  .app { display:flex; height:100vh; min-width:1100px; }

  /* ---------- left navigation ---------- */
  .nav { width:76px; flex-shrink:0; background:var(--navy); position:relative; display:flex; flex-direction:column; align-items:center; padding:13px 0 8px; }
  .nav .logo { width:54px; height:50px; object-fit:contain; }
  .nav .primary { margin:auto 0; display:flex; flex-direction:column; gap:8px; width:60px; }
  .nav .secondary { display:flex; flex-direction:column; width:60px; }
  .nav-item { width:60px; padding:8px 0; border-radius:4px; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; line-height:1.2; color:var(--teal-90); text-align:center; }
  .nav-item:hover { background:rgba(173,213,221,.12); }
  .nav-item.selected { background:var(--teal-90); color:var(--navy); }
  .nav .divider { height:1px; background:rgba(173,213,221,.35); width:100%; }

  /* ---------- main ---------- */
  .main { flex:1 0 0; min-width:0; display:flex; flex-direction:column; }
  .header { height:60px; flex-shrink:0; background:var(--off-white); display:flex; align-items:center; justify-content:space-between; padding:8px 12px; }
  .header .tabs { display:flex; }
  .header .tab { display:flex; gap:10px; align-items:center; padding:8px 18px; border-radius:6px; font-weight:600; color:var(--navy); }
  .header .tab.on { background:var(--navy); color:#fff; }
  .header .right { display:flex; gap:8px; align-items:center; }
  .btn { display:flex; gap:8px; align-items:center; padding:7px 13px; border-radius:6px; background:var(--coral); border:1px solid var(--coral); color:var(--navy); font-weight:600; }
  .btn:hover { filter:brightness(.96); }
  .avatar { position:relative; width:43px; height:44px; }
  .avatar .ring { position:absolute; left:1px; top:2px; width:42px; height:42px; }
  .avatar .shot { position:absolute; left:5px; top:6px; width:34px; height:34px; border:2px solid #fff; border-radius:80px; object-fit:cover; }
  .avatar .status { position:absolute; left:0; top:0; width:18px; height:18px; }

  .page-title { padding:8px 15px; height:57px; font-size:30px; line-height:41px; font-weight:600; margin:0; border-top:1px solid var(--line); }
  .filters { display:flex; justify-content:space-between; align-items:center; padding:8px 15px 0; }
  .filters .left { display:flex; gap:8px; align-items:center; position:relative; }
  .select { width:261px; display:flex; align-items:center; gap:8px; padding:9px 13px; background:#fff; border:1px solid var(--border); border-radius:6px; text-align:left; color:#000; }
  .select .v { flex:1 0 0; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .select .v b { font-weight:700; }
  .select.open { border-color:#86b7fe; box-shadow:0 0 0 .25rem rgba(13,110,253,.25); }
  .clear { color:var(--navy); text-decoration:underline; }
  .search { width:261px; display:flex; gap:4px; align-items:center; padding:8px; background:var(--grey-100); border-radius:4px; color:#6c757d; }
  .search input { flex:1; min-width:0; border:0; background:none; font:inherit; color:var(--text); outline:none; line-height:1.5; }
  .search input::placeholder { color:#6c757d; }

  .dropdown { position:absolute; top:41px; width:266px; z-index:10; background:#fff; border:1px solid rgba(0,0,0,.15); border-radius:6px; padding:9px; display:flex; flex-direction:column; gap:8px;
              box-shadow:0 .5rem 1rem rgba(0,0,0,.08); }
  .dropdown .opt { display:flex; gap:8px; align-items:center; padding:4px; width:100%; text-align:left; color:var(--text); }
  .dropdown .opt:hover { background:#f8f9fa; }
  .radio { width:16px; height:16px; border-radius:100px; border:1px solid var(--radio-border); background:#fff; position:relative; }
  .radio.on { background:var(--navy); border-color:var(--navy); }
  .radio.on::after { content:''; position:absolute; left:3px; top:3px; width:8px; height:8px; border-radius:50%; background:#fff; }
  .dropdown .footer { border-top:1px solid var(--line); padding:8px 12px 0; display:flex; justify-content:flex-end; }

  .tertiary { display:flex; gap:4px; padding:8px 15px; }
  .badge-tab { padding:8px 16px; border-radius:4px; background:var(--grey-100); color:var(--text-2); }
  .badge-tab.on { background:var(--navy); color:var(--off-white); }

  /* ---------- table ---------- */
  /* Title column takes the spare width so it stays stuck to the pin/flag toggles at any screen size */
  .cols { display:grid; grid-template-columns:52px minmax(0,1fr) 216px 262px 90px 110px; column-gap:12px; padding:0 20px 0 8px; }
  .thead { height:31px; align-items:center; border-bottom:1px solid var(--line); font-size:12px; line-height:21px; color:var(--text-3); }
  .thead .r, .row .r { text-align:right; }
  .tbody { flex:1 0 0; overflow-y:auto; }
  .group-header { display:flex; gap:12px; align-items:center; padding:12px 20px 8px; background:#f8f9fa; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-size:12px; font-weight:700; color:var(--group-text); text-transform:uppercase; }
  .group-header::after { content:''; flex:1; height:1px; background:var(--line); }

  .row { position:relative; height:51px; align-items:center; border-bottom:1px solid var(--line); background:#fff; }
  .row:hover { background:#f8f9fa; }
  .row .title { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .row .t1 { display:flex; gap:2px; align-items:center; min-width:0; }
  .row .t1 .name { font-weight:600; line-height:21px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row.unread .t1 .name { font-weight:700; }
  /* Quick toggles (Gmail star / important pattern): outline when off, filled when on */
  .row .quick { display:flex; gap:4px; align-items:center; }
  .quick-btn { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--quick-off); }
  .quick-btn:hover { background:rgba(20,48,76,.08); color:var(--text-2); }
  .quick-btn.pin.on { color:var(--navy); }
  .quick-btn.flag.on { color:var(--flag); }
  .quick-btn:focus-visible { outline:2px solid #86b7fe; outline-offset:1px; }
  .row .t2 { display:flex; gap:8px; align-items:center; line-height:21px; color:var(--text-2); white-space:nowrap; overflow:hidden; min-width:0; }
  .row .t2 .sep { width:1px; height:14px; background:var(--border); flex-shrink:0; }
  .row .t2 .txt { overflow:hidden; text-overflow:ellipsis; }
  .pill { padding:2px 7.8px; border-radius:100px; font-size:12px; font-weight:600; line-height:16px; color:var(--text); flex-shrink:0; }
  .pill.high, .pill.urgent { background:var(--urgent); color:var(--off-white); }
  .pill.medium { background:var(--medium); }
  .pill.low { background:var(--low); }
  .row .status { line-height:21px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .status.progress { color:var(--progress); }
  .row .status.done { color:var(--done); }
  .row .role { display:flex; gap:4px; align-items:center; color:var(--navy); white-space:nowrap; overflow:hidden; }
  .row .updated { font-size:16px; line-height:21px; color:var(--text-2); white-space:nowrap; }
  .row .created { line-height:21px; color:var(--text-2); white-space:nowrap; }



</style>

const fmtTime = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
// Dates are minutes relative to midnight 5 Aug 2026 ("today"); negative values fall on earlier days
const dateLabel = m => { const d = new Date(2026, 7, 5 + Math.floor(m / 1440)); return `${d.getDate()} ${d.toLocaleString('en-GB', { month:'short' })}`; };
const timeOfDay = m => ((m % 1440) + 1440) % 1440;
const fmtDay = m => `${dateLabel(m)} ${fmtTime(timeOfDay(m))}`;
// Last updated shows just the time for today (5 Aug), otherwise the date too
const fmtUpdated = m => m >= 0 && m < 1440 ? fmtTime(m) : fmtDay(m);
const wardNo = w => w.replace(/^Ward /, '');

function groupItems(items, groupKey) {
  const g = GROUPS.find(x => x.key === groupKey);
  if (!g.by) return [{ label:null, items }];
  const map = new Map();
  items.forEach(i => { const k = g.by(i); if (!map.has(k)) map.set(k, []); map.get(k).push(i); });
  const keys = [...map.keys()];
  if (g.order) keys.sort((a,b) => g.order.indexOf(a) - g.order.indexOf(b));
  // Items with no value for the grouping field sit at the bottom
  if (g.last) keys.sort((a,b) => (a === g.last) - (b === g.last));
  return keys.map(k => ({ label:k, items:map.get(k) }));
}

  edit:    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z" fill="currentColor" />,
  flag:    <path d="M14.4 6 14 4H5v17h2v-7h5.6l.4 2h7V6z" fill="currentColor" />,
  pin:     <path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z" fill="currentColor" />,
  pinOutline:  <path d="M14 4v5c0 1.12.37 2.16 1 3H9c.65-.86 1-1.9 1-3V4zm3-2H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3V4h1c.55 0 1-.45 1-1s-.45-1-1-1" fill="currentColor" />,
  flagOutline: <path d="m14 6-1-2H5v17h2v-7h5l1 2h7V6zm4 8h-4l-1-2H7V6h5l1 2h5z" fill="currentColor" />,
};
const Icon = ({ name, size = 24, className, label }) => (
  <svg className={className} width={size} height={size} viewBox="0 0 24 24" role={label ? 'img' : undefined} aria-label={label} aria-hidden={label ? undefined : true}>{MI[name]}</svg>
);

const KIND_ICON = { chat:'chat.svg', person:'person.svg', alert:'warning.svg' };

/* ---------------- row ---------------- */

function Row({ item, pinned, flagged, onTogglePin, onToggleFlag }) {
  const icon = item.kind === 'task' ? (item.unread ? 'task-unread.svg' : 'task-read.svg') : KIND_ICON[item.kind];
  const as = IN_CONVERSATION_AS[item.id] || 'You';
  const statusClass = item.status === 'In Progress' ? ' progress' : item.status === 'Done' ? ' done' : '';
  const location = [`Site: ${item.site}`, `Ward: ${item.ward && wardNo(item.ward)}`, item.bay && `Bay: ${item.bay.replace(/^Bay /, '')}`].filter(Boolean).join(', ');
  return (
    <div className={`row cols${item.unread ? ' unread' : ''}`} role="row">
      {/* Leading quick toggles, like Gmail's star / important markers */}
      <div className="quick">
        <button className={`quick-btn pin${pinned ? ' on' : ''}`} aria-pressed={pinned} onClick={onTogglePin}
                aria-label={pinned ? 'Pinned' : 'Not pinned'} title={pinned ? 'Unpin' : 'Pin'}>
          <Icon name={pinned ? 'pin' : 'pinOutline'} size={18} />
        </button>
        <button className={`quick-btn flag${flagged ? ' on' : ''}`} aria-pressed={flagged} onClick={onToggleFlag}
                aria-label={flagged ? 'Flagged' : 'Not flagged'} title={flagged ? 'Unflag' : 'Flag'}>
          <Icon name={flagged ? 'flag' : 'flagOutline'} size={18} />
        </button>
      </div>
      <div className="title">
        <div className="t1">
          <img src={ROW_ICON[icon]} width="20" height="20" alt="" />
          <span className="name">{item.title}</span>
        </div>
        <div className="t2">
          {item.kind === 'task' && <>
            {item.priority && <span className={`pill ${item.priority}`}>{PRIORITY_LABEL[item.priority]}</span>}
            <span>Type: {item.type}</span>
            <span className="sep" />
            <span className="txt">{location}</span>
          </>}
          {item.kind === 'alert' && <span className="txt">Raised by {item.raisedBy}</span>}
          {item.preview && <span className="txt">{item.preview}</span>}
        </div>
      </div>
      <div className={`status${statusClass}`}>{item.status || ''}</div>
      <div className="role">
        <img src={ICON[(as === 'You' ? 'account-circle.svg' : 'role-badge.svg')]} width="24" height="24" alt="" />
        <span>{as}</span>
      </div>
      <div className="updated r">{fmtUpdated(item.updated)}</div>
      <div className="created r">{fmtDay(item.created)}</div>
    </div>
  );
}

/* ---------------- dropdown (radio list + Apply) ---------------- */

function Dropdown({ kind, value, onPick, onApply, left }) {
  const opts = kind === 'sort' ? SORTS : WEB_GROUPS;
  return (
    <div className="dropdown" role="dialog" aria-label={kind === 'sort' ? 'Sort by' : 'Group by'} style={{ left }}>
      {opts.map(o => (
        <button key={o.key} className="opt" role="radio" aria-checked={value === o.key} onClick={() => onPick(o.key)}>
          <span className={`radio${value === o.key ? ' on' : ''}`} />
          {o.key === 'lastUpdated' ? 'Last updated (default)' : o.label}
        </button>
      ))}
      <div className="footer"><button className="btn" onClick={onApply}>Apply</button></div>
    </div>
  );
}

/* ---------------- screen ---------------- */

const NAV_PRIMARY = [['Inbox','nav-inbox.svg'], ['Finder','nav-finder.svg'], ['My Roles','nav-roles.svg']];
const NAV_ADMIN = [['Admin','nav-admin.svg'], ['Settings','nav-settings.svg'], ['Insights','nav-insights.svg']];

function Inbox({ s, set }) {
  const filtersRef = useRef(null);
  useEffect(() => {
    if (!s.menu) return;
    // Clicking outside the dropdown dismisses it without applying
    const close = e => { if (filtersRef.current && !filtersRef.current.contains(e.target)) set({ menu:null }); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [s.menu]);

  const toggleMenu = kind => set({ menu: s.menu && s.menu.kind === kind ? null : { kind, draft: kind === 'sort' ? s.sort : s.group } });
  // Apply reads the latest draft, so a quick pick-then-Apply never commits a stale choice
  const apply = () => set(prev => prev.menu ? { [prev.menu.kind]:prev.menu.draft, menu:null } : {});

  const sortDef = SORTS.find(x => x.key === s.sort);
  const groupDef = WEB_GROUPS.find(g => g.key === s.group);
  const q = s.query.trim().toLowerCase();
  const tabMatch = i => WEB_TABS.find(t => t.key === s.tab).match(i) && (!q || (item => item.title + ' ' + (item.preview || '') + ' ' + (item.type || '')).call(null, i).toLowerCase().includes(q));

  // Pinning only applies when ungrouped: pinned items lead the list (no headers) in pin order, ignoring the sort.
  const usePins = s.group === 'none';
  const pinnedItems = usePins ? s.pinned.map(id => ITEMS.find(i => i.id === id)).filter(tabMatch) : [];
  const visible = ITEMS.filter(i => tabMatch(i) && !pinnedItems.includes(i)).sort(sortDef.cmp);
  const sections = pinnedItems.length ? [{ label:null, items:[...pinnedItems, ...visible] }] : groupItems(visible, s.group);

  const toggle = (key, id) => set(prev => ({ [key]: prev[key].includes(id) ? prev[key].filter(x => x !== id) : [...prev[key], id] }));

  const headerLabel = label => s.group === 'priority' ? PRIORITY_HEADER[label] || label : label;
  const isDefault = s.sort === 'lastUpdated' && s.group === 'none';

  return (
    <div className="app">
      <nav className="nav" aria-label="Main">
        <img className="logo" src={ICON['logo-mark.png']} alt="Alertive" />
        <div className="primary">
          <div>{NAV_PRIMARY.map(([label, ic], i) => (
            <button key={label} className={`nav-item${i === 0 ? ' selected' : ''}`}><img src={ICON[ic]} width="24" height="24" alt="" />{label}</button>
          ))}</div>
          <div className="divider" />
          <div>{NAV_ADMIN.map(([label, ic]) => (
            <button key={label} className="nav-item"><img src={ICON[ic]} width="24" height="24" alt="" />{label}</button>
          ))}</div>
          <div className="divider" />
          <button className="nav-item"><img src={ICON['nav-signout.svg']} width="24" height="24" alt="" />Sign out</button>
        </div>
        <div className="secondary">
          <button className="nav-item"><img src={ICON['nav-feedback.svg']} width="24" height="24" alt="" />Leave Feedback</button>
          <button className="nav-item">Cookies</button>
          <button className="nav-item">Privacy Policy</button>
        </div>
      </nav>

      <div className="main">
        <header className="header">
          <div className="tabs">
            <button className="tab on"><img src={ICON['tab-accounts.svg']} width="24" height="24" alt="" />Accounts</button>
            <button className="tab"><img src={ICON['account-circle.svg']} width="24" height="24" alt="" />Kevin Douglas</button>
            <button className="tab"><img src={ICON['role-badge.svg']} width="24" height="24" alt="" />Cardiology Registrar</button>
          </div>
          <div className="right">
            <button className="btn"><Icon name="edit" size={16} />Create</button>
            <div className="avatar">
              <img className="ring" src={ICON['avatar-ring.svg']} alt="" />
              <img className="shot" src={ICON['avatar-headshot.jpg']} alt="Your profile" />
              <img className="status" src={ICON['avatar-status.svg']} alt="Online" />
            </div>
          </div>
        </header>

        <h1 className="page-title">Inbox</h1>

        <div className="filters">
          <div className="left" ref={filtersRef}>
            <button className={`select${s.menu && s.menu.kind === 'sort' ? ' open' : ''}`} onClick={() => toggleMenu('sort')} aria-haspopup="dialog">
              <span className="v"><b>Sort:</b> {s.sort === 'lastUpdated' ? 'Last updated (Default)' : sortDef.label}</span><Icon name="expand" size={16} />
            </button>
            <button className={`select${s.menu && s.menu.kind === 'group' ? ' open' : ''}`} onClick={() => toggleMenu('group')} aria-haspopup="dialog">
              <span className="v"><b>Group:</b> {groupDef.label}</span><Icon name="expand" size={16} />
            </button>
            {!isDefault && <button className="clear" onClick={() => set({ sort:'lastUpdated', group:'none', menu:null })}>Clear</button>}
            {s.menu && <Dropdown kind={s.menu.kind} value={s.menu.draft} left={s.menu.kind === 'sort' ? -5 : 264}
                                 onPick={key => set(prev => ({ menu:{ ...prev.menu, draft:key } }))} onApply={apply} />}
          </div>
          <label className="search">
            <Icon name="search" size={16} />
            <input type="search" placeholder="Search conversations" value={s.query} onChange={e => set({ query:e.target.value })} />
          </label>
        </div>

        <div className="tertiary" role="tablist">
          {WEB_TABS.map(t => (
            <button key={t.key} role="tab" aria-selected={s.tab === t.key} className={`badge-tab${s.tab === t.key ? ' on' : ''}`} onClick={() => set({ tab:t.key })}>{t.label}</button>
          ))}
        </div>

        <div className="thead cols" role="row">
          <span style={{ gridColumn:'span 2' }}>Title</span><span>Status</span><span>In conversation as</span><span className="r">Last updated</span><span className="r">Date Created</span>
        </div>
        <div className="tbody" role="table">
          {sections.map(sec => (
            <React.Fragment key={sec.label || 'all'}>
              {sec.label && <div className="group-header">{headerLabel(sec.label)}</div>}
              {sec.items.map(i => (
                <Row key={i.id} item={i} pinned={s.pinned.includes(i.id)} flagged={s.flagged.includes(i.id)}
                     onTogglePin={() => toggle('pinned', i.id)} onToggleFlag={() => toggle('flagged', i.id)} />
              ))}
            </React.Fragment>
          ))}
          {!sections.some(sec => sec.items.length) && <p style={{ padding:'24px 20px', color:'var(--text-2)' }}>No conversations match.</p>}
        </div>
      </div>
    </div>
  );
}

/* ---------------- prototype shell ---------------- */

const INITIAL = { sort:'lastUpdated', group:'none', menu:null, tab:'all', query:'', pinned:['beds', 'obs'], flagged:ITEMS.filter(i => i.flagged).map(i => i.id) };

function App() {
  const [s, setS] = useState(INITIAL);
  const set = patch => setS(prev => ({ ...prev, ...(typeof patch === 'function' ? patch(prev) : patch) }));
  return <Inbox s={s} set={set} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
