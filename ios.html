<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sorting &amp; Grouping iOS — Alertive</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --navy-40:#14304c; --navy-50:#0c2237; --label:#000; --label-2:rgba(60,60,67,.6); --text-10:#5c5d5f; --menu-label:#5b6c7d;
    --bar-bg:#f2f2f9; --fill-3:rgba(120,120,128,.12); --seg-bg:rgba(118,118,128,.12); --sep:rgba(84,84,86,.34);
    --group-bg:#dde2e7; --chip-enabled:#eeeeef; --chip-active:#b6bdc3;
    --task:#800080; --urgent:#ff3b30; --high:#ff0000; --medium:#eb8333; --low:#43a047; --flag:#ef6c00; --pin:#ff9500;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:#e9ecef; font-family:-apple-system, 'SF Pro Text', 'SF Pro', system-ui, 'Helvetica Neue', sans-serif; color:var(--label); -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  img { display:block; }
  svg { display:block; flex-shrink:0; }

  .page { min-height:100vh; padding:32px 16px; display:flex; justify-content:center; align-items:flex-start; gap:32px; flex-wrap:wrap; }

  /* ---------- device (402 × 874, iPhone 16 Pro) ---------- */
  .screen { position:relative; width:402px; height:874px; background:#fff; border-radius:48px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,.12); }

  .navbar { position:absolute; top:0; left:0; width:402px; height:190px; z-index:3; background:var(--bar-bg); border-bottom:.333px solid rgba(0,0,0,.3); }
  .status-bar { height:54px; padding-top:21px; display:flex; align-items:center; }
  .status-bar .time { flex:1 0 0; text-align:center; padding:0 6px 0 16px; font-size:17px; line-height:22px; font-weight:590; }
  .status-bar .island { width:124px; height:10px; }
  .status-bar .levels { flex:1 0 0; display:flex; gap:7px; align-items:center; justify-content:center; padding:0 16px 0 6px; }
  .island-pill { position:absolute; top:11px; left:50%; width:126px; height:37px; margin-left:-63px; border-radius:20px; background:#000; }

  .title-row { position:relative; height:44px; }
  .back { position:absolute; left:0; top:0; height:44px; padding:0 8px; display:flex; align-items:center; gap:6px; color:var(--navy-40); font-size:17px; line-height:22px; letter-spacing:-.43px; }
  .nav-title { position:absolute; left:121px; top:11px; width:160px; text-align:center; font-size:17px; line-height:22px; font-weight:590; letter-spacing:-.43px; }
  .more { position:absolute; right:16px; top:0; height:44px; display:flex; align-items:center; color:var(--navy-40); }

  .chips { display:flex; gap:8px; padding:8px 16px; height:44px; }
  .chip { flex:1 0 0; min-width:0; height:28px; padding:4px 10px; border-radius:40px; background:var(--fill-3); color:var(--navy-40); display:flex; align-items:center; gap:6px; font-size:15px; line-height:20px; letter-spacing:-.23px; text-align:left; }
  .chip.active { background:var(--navy-40); color:#fff; }
  .chip .label { flex:1 0 0; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip .label b { font-weight:700; }

  .seg-wrap { padding:8px 16px; }
  .seg { height:32px; display:flex; align-items:center; padding:2px; border-radius:8px; background:var(--seg-bg); }
  .seg button { flex:1 0 0; height:100%; border-radius:6px; font-size:15px; line-height:20px; letter-spacing:-.24px; position:relative; }
  .seg button.on { background:#fff; font-weight:600; box-shadow:0 3px 4px rgba(0,0,0,.12), 0 3px .5px rgba(0,0,0,.04); }
  .seg button + button:not(.on)::before { content:''; position:absolute; left:0; top:7px; bottom:7px; width:.64px; background:rgba(142,142,147,.3); }
  .seg button.on + button::before { display:none; }

  .rows { position:absolute; top:190px; left:0; bottom:78px; width:402px; overflow-y:auto; background:#fff; }
  .rows::-webkit-scrollbar { display:none; }
  .group-header { background:var(--group-bg); padding:4px 12px; font-size:13px; line-height:18px; font-weight:590; letter-spacing:-.08px; color:var(--navy-40); text-transform:uppercase; }

  .row { position:relative; display:flex; align-items:stretch; width:100%; text-align:left; background:#fff; touch-action:pan-y; user-select:none; }
  .row:active { background:#f2f2f7; }

  /* Leading swipe action (iOS Notes/Messages pattern): drag a row right to Pin / Unpin */
  .swipe { position:relative; overflow:hidden; }
  .swipe-track { position:relative; transition:transform .25s cubic-bezier(.2,.8,.2,1); }
  .swipe.dragging .swipe-track { transition:none; }
  .swipe-action { position:absolute; inset:0 auto 0 0; width:100%; background:var(--pin); color:#fff; display:flex; align-items:center; padding-left:22px; }
  .swipe-action span { width:52px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:13px; line-height:16px; font-weight:500; }
  .row .strip { width:8px; flex-shrink:0; }
  .row.task .strip { background:var(--task); }
  .row.alert .strip { background:var(--high); }
  .row .meta { display:flex; align-items:center; gap:4px; height:18px; font-size:13px; line-height:18px; letter-spacing:-.08px; color:#000; }
  /* Pill is authored at 1.1x and scaled to 83% in Figma (72:4866) */
  .row .pill { padding:1.8px 8.2px; border-radius:11px; font-family:Roboto, -apple-system, sans-serif; font-size:11px; line-height:12.4px; font-weight:500; letter-spacing:.37px; color:#000; white-space:nowrap; }
  .row .line { font-size:13px; line-height:18px; letter-spacing:-.08px; color:#090909; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .line.secondary { color:var(--label-2); }
  .row .contents { flex:1 0 0; min-width:0; padding-left:16px; display:flex; }
  .row.has-strip .contents { padding-left:10px; }
  .row .cell { flex:1 0 0; min-width:0; display:flex; border-bottom:.333px solid var(--sep); padding:4px 0; }
  .row .main { flex:1 0 0; min-width:0; display:flex; flex-direction:column; gap:8px; justify-content:center; }
  .row .title { display:flex; align-items:center; gap:6px; height:22px; font-size:15px; line-height:20px; font-weight:590; letter-spacing:-.23px; }
  .row .title .t { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .row .preview { font-size:13px; line-height:18px; letter-spacing:-.08px; color:var(--label-2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .row .created { font-size:12px; line-height:16px; color:var(--label-2); }
  .row .side { width:77px; flex-shrink:0; position:relative; padding:4px 32px 0 8px; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .row .time { font-size:13px; line-height:18px; letter-spacing:-.08px; color:var(--label-2); white-space:nowrap; margin-top:7px; }
  .row.unread .time { color:var(--navy-40); }
  .row .dot { position:absolute; right:7px; top:15px; width:10px; height:10px; border-radius:50%; background:var(--navy-40); }
  .row .badges { display:flex; gap:6px; align-items:center; margin-top:2px; }
  .row .flag { color:var(--flag); }
  .row .pin-badge { color:var(--label-2); display:flex; }
  .row .pin-badge svg { width:12px; height:13px; }

  .toolbar { position:absolute; left:0; bottom:0; width:402px; height:78px; z-index:2; background:var(--bar-bg); border-top:1px solid #ddd; padding:9px 16px 40px; display:flex; align-items:center; justify-content:space-between; color:var(--navy-40); }
  .toolbar-spacer { width:30px; } /* keeps the unread count centred */
  .toolbar .count { font-size:13px; line-height:18px; letter-spacing:-.08px; color:#000; }
  .home-indicator { position:absolute; left:50%; bottom:8px; width:144px; height:5px; margin-left:-72px; border-radius:100px; background:#000; z-index:4; }

  .scrim { position:absolute; inset:0; z-index:4; }
  .menu { position:absolute; top:142px; width:250px; border-radius:12px; overflow:hidden; z-index:5;
          background:rgba(246,246,246,.9); -webkit-backdrop-filter:blur(25px); backdrop-filter:blur(25px); box-shadow:0 0 16px rgba(0,0,0,.2);
          transform-origin:top center; animation:pop .18s ease-out; }
  @keyframes pop { from { opacity:0; transform:scale(.92); } }
  .menu .opt { display:flex; align-items:center; width:100%; height:44px; padding:0 16px; text-align:left; font-size:17px; line-height:22px; letter-spacing:-.43px; border-bottom:.5px solid rgba(128,128,128,.55); }
  .menu .opt:last-child { border-bottom:0; }
  .menu .opt:active { background:rgba(0,0,0,.06); }
  .menu .opt span { flex:1 0 0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- prototype controls (outside the device) ---------- */
  .panel { width:280px; font-size:14px; color:var(--navy-50); }
  .panel h1 { font-size:18px; line-height:24px; margin:0 0 4px; font-weight:700; }
  .panel p { margin:0 0 16px; color:var(--text-10); line-height:20px; }
  .panel h2 { font-size:12px; line-height:16px; letter-spacing:.5px; font-weight:500; color:var(--menu-label); margin:20px 0 8px; text-transform:uppercase; }
  .frames { display:flex; flex-direction:column; gap:4px; }
  .frame { display:flex; gap:10px; align-items:center; width:100%; text-align:left; padding:8px 10px; border-radius:8px; background:#fff; border:1px solid transparent; line-height:18px; }
  .frame:hover { border-color:var(--chip-active); }
  .frame.current { background:var(--navy-50); color:#fff; }
  .frame .n { width:22px; height:22px; border-radius:50%; background:var(--chip-enabled); color:var(--navy-50); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .frame.current .n { background:#28bad1; color:var(--navy-50); }
  .frame small { display:block; font-size:11px; opacity:.7; }
  .reset { margin-top:16px; font-size:13px; text-decoration:underline; color:var(--navy-40); }
</style>

// iOS shows 12-hour times ("4:51pm")
const fmtTime12 = m => { const h = Math.floor(m/60), mm = String(m%60).padStart(2,'0'); return `${h % 12 || 12}:${mm}${h < 12 ? 'am' : 'pm'}`; };
// "In progress at 13:13" → "In progress at 1:13pm"
const to12h = str => str.replace(/(\d{1,2}):(\d{2})/, (_, h, mm) => fmtTime12(+h * 60 + +mm));
const fmtTime = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const fmtCreated = m => {
  const day = m < 0 ? 4 : 5;
  const mins = ((m % 1440) + 1440) % 1440;
  return `Created ${day} Aug at ${fmtTime(mins)}`;
};

function groupItems(items, groupKey) {
  const g = GROUPS.find(x => x.key === groupKey);
  if (!g.by) return [{ label:null, items }];
  const map = new Map();
  items.forEach(i => { const k = g.by(i); if (!map.has(k)) map.set(k, []); map.get(k).push(i); });
  const keys = [...map.keys()];
  if (g.order) keys.sort((a,b) => g.order.indexOf(a) - g.order.indexOf(b));
  // Items with no value for the grouping field sit at the bottom
  if (g.last) keys.sort((a,b) => (a === g.last) - (b === g.last));
  return keys.map(k => ({ label:k, items:map.get(k) }));
}

const ACTION_W = 96, FULL_SWIPE = 200;

// Drag right to reveal Pin/Unpin; a long drag pins straight away, a short one leaves the action open.
function SwipeRow({ item, pinned, onTogglePin }) {
  const [x, setX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const start = useRef(null);
  const moved = useRef(false);

  const down = e => { start.current = { x:e.clientX - x, y:e.clientY }; moved.current = false; e.currentTarget.setPointerCapture(e.pointerId); };
  const move = e => {
    if (!start.current) return;
    const dx = e.clientX - start.current.x;
    if (!moved.current && Math.abs(dx) < 6) return;
    moved.current = true; setDragging(true);
    setX(Math.max(0, Math.min(dx, 260)));
  };
  const up = () => {
    if (!start.current) return;
    start.current = null; setDragging(false);
    if (x > FULL_SWIPE) { setX(0); onTogglePin(); }
    else setX(x > ACTION_W / 2 ? ACTION_W : 0);
  };
  const click = e => { if (moved.current || x) { e.preventDefault(); if (!moved.current) setX(0); } };

  return (
    <div className={`swipe${dragging ? ' dragging' : ''}`}>
      <button className="swipe-action" style={{ width: Math.max(x, ACTION_W) }} onClick={() => { setX(0); onTogglePin(); }} tabIndex={x ? 0 : -1}>
        <span>{pinned ? <Sym.unpin /> : <Sym.pin />}{pinned ? 'Unpin' : 'Pin'}</span>
      </button>
      <div style={{ transform:`translateX(${x}px)` }} className="swipe-track"
           onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onClickCapture={click}>
        <Row item={item} pinned={pinned} />
      </div>
    </div>
  );
}

/* ---------------- pull-down menu ---------------- */

function Menu({ kind, value, onPick, onClose }) {
  const opts = kind === 'sort' ? SORTS : GROUPS;
  return (
    <>
      <div className="scrim" onClick={onClose} />
      <div className="menu" role="menu" style={{ left: kind === 'sort' ? 16 : 135 }}>
        {opts.map(o => (
          <button key={o.key} className="opt" role="menuitemradio" aria-checked={value === o.key} onClick={() => onPick(o.key)}>
            <span>{o.menu || o.label}</span>
            {value === o.key && <Sym.checkmark />}
          </button>
        ))}
      </div>
    </>
  );
}

/* ---------------- screen ---------------- */

function Chip({ name, label, active, onClick }) {
  return (
    <button className={`chip${active ? ' active' : ''}`} onClick={onClick} aria-haspopup="menu">
      <span className="label"><b>{name}:</b> {label}</span>
      <Sym.chevronDown />
    </button>
  );
}

function SortGroupScreen({ s, set }) {
  const timer = useRef(null);
  useEffect(() => () => clearTimeout(timer.current), []);

  const openMenu = kind => set({ menu:{ kind, draft: kind === 'sort' ? s.sort : s.group } });
  const pick = key => {
    // iOS pull-down: the checkmark moves, then the menu dismisses and applies.
    const kind = s.menu.kind;
    set({ menu:{ kind, draft:key } });
    clearTimeout(timer.current);
    timer.current = setTimeout(() => set({ [kind]:key, menu:null }), 180);
  };

  const sortDef = SORTS.find(x => x.key === s.sort);
  const groupDef = GROUPS.find(g => g.key === s.group);
  const tabMatch = TABS.find(t => t.key === s.tab).match;
  // Pinning only applies when ungrouped: pinned items then ignore the sort (staying in pin order) in their own section.
  // Once a grouping is applied, pinned items fall back into their normal groups.
  const usePins = s.group === 'none';
  const pinnedItems = usePins ? s.pinned.map(id => ITEMS.find(i => i.id === id)).filter(tabMatch) : [];
  const visible = ITEMS.filter(i => tabMatch(i) && !pinnedItems.includes(i)).sort(sortDef.cmp);
  const grouped = groupItems(visible, s.group);
  // Ungrouped: pinned items simply lead the list (no section headers); the pin icon marks them
  const sections = pinnedItems.length ? [{ label:null, items:[...pinnedItems, ...visible] }] : grouped;
  const togglePin = id => set({ pinned: s.pinned.includes(id) ? s.pinned.filter(p => p !== id) : [...s.pinned, id] });
  const unreadCount = ITEMS.filter(i => i.unread).length;

  return (
    <div className="screen">
      <div className="island-pill" />
      <div className="navbar">
        <div className="status-bar">
          <span className="time">9:41</span>
          <span className="island" />
          <span className="levels" aria-hidden="true">
            <img src={ICON['cellular.svg']} width="19.2" height="12.226" alt="" />
            <img src={ICON['wifi.svg']} width="17.142" height="12.328" alt="" />
            <img src={ICON['battery.svg']} width="27.328" height="13" alt="" />
          </span>
        </div>
        <div className="title-row">
          <button className="back"><Sym.chevronLeft />Back</button>
          <div className="nav-title">All Conversations</div>
          <button className="more" aria-label="More"><Sym.ellipsisCircle /></button>
        </div>
        <div className="chips">
          <Chip name="Sort" label={sortDef.label} active={s.sort !== 'lastUpdated'} onClick={() => openMenu('sort')} />
          <Chip name="Group" label={groupDef.label} active={s.group !== 'none'} onClick={() => openMenu('group')} />
        </div>
        <div className="seg-wrap">
          <div className="seg" role="tablist">
            {TABS.map(t => (
              <button key={t.key} role="tab" className={s.tab === t.key ? 'on' : ''} aria-selected={s.tab === t.key} onClick={() => set({ tab:t.key })}>{t.label}</button>
            ))}
          </div>
        </div>
      </div>

      <div className="rows">
        {sections.map(sec => (
          <React.Fragment key={sec.label || 'all'}>
            {sec.label && <div className="group-header">{sec.label}</div>}
            {sec.items.map(i => <SwipeRow key={i.id} item={i} pinned={s.pinned.includes(i.id)} onTogglePin={() => togglePin(i.id)} />)}
          </React.Fragment>
        ))}
      </div>

      <div className="toolbar">
        <span className="toolbar-spacer" aria-hidden="true" />
        <span className="count">{unreadCount} unread</span>
        <button aria-label="New conversation"><Sym.compose /></button>
      </div>
      <div className="home-indicator" />

      {s.menu && <Menu kind={s.menu.kind} value={s.menu.draft} onPick={pick} onClose={() => set({ menu:null })} />}
    </div>
  );
}

/* ---------------- prototype shell ---------------- */

const INITIAL = { ...FRAMES[0].state, tab:'all', pinned:['beds', 'obs'] };

function currentFrame(s) {
  if (s.tab !== 'all') return -1;
  return FRAMES.findIndex(({ state:f }) =>
    f.sort === s.sort && f.group === s.group &&
    (f.menu ? s.menu && f.menu.kind === s.menu.kind && f.menu.draft === s.menu.draft : !s.menu));
}

function App() {
  const [s, setS] = useState(INITIAL);
  const set = patch => setS(prev => ({ ...prev, ...patch }));
  const cur = currentFrame(s);

  return (
    <div className="page">
      <SortGroupScreen s={s} set={set} />
      <aside className="panel">
        <h1>Sorting &amp; Grouping · iOS</h1>
        <p>Use the Sort and Group buttons on the phone, or jump straight to a Figma frame. Drag a row to the right to pin or unpin it.</p>
        <h2>Figma frames</h2>
        <div className="frames">
          {FRAMES.map((f, i) => (
            <button key={f.node} className={`frame${cur === i ? ' current' : ''}`} onClick={() => setS(prev => ({ ...prev, tab:'all', ...f.state }))}>
              <span className="n">{i + 1}</span>
              <span>{f.title}<small>{f.sub} · {f.node}</small></span>
            </button>
          ))}
        </div>
        <button className="reset" onClick={() => setS(INITIAL)}>Reset prototype</button>
      </aside>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
